[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufam-redaction-backend"
version = "0.1.0"
description = "Sistema de Identificação e Tarjamento de Dados Pessoais — UFAM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "celery==5.4.0",
    "redis==5.2.1",
    "PyMuPDF==1.24.14",
    "pikepdf==9.4.2",
    "spacy==3.8.2",
    "paddlepaddle==2.6.2",
    "paddleocr==2.9.1",
    "rapidocr-onnxruntime==1.4.3",
    "onnxruntime==1.20.1",
    "Pillow==11.0.0",
    "numpy==1.26.4",
    "pytesseract==0.3.13",
    "python-magic==0.4.27",
    "reportlab==4.2.5",
    "PyJWT[crypto]==2.10.1",
    "python-multipart==0.0.19",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
